<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Funny</title>
<style>
  body { margin:0; height:100vh; display:grid; place-items:center; gap:1rem;
         font-family:system-ui,sans-serif; background:#111; color:#fff; }
  .row { display:flex; gap:1rem; }
  button { font-size:1.4rem; padding:1rem 2rem; border:0; border-radius:12px; cursor:pointer; }
  #go { background:#ff3d7f; color:#fff; }
  p { color:#aaa; text-align:center; margin:0; }
  #ver { position:fixed; bottom:8px; right:10px; color:#666; font-size:.85rem; font-family:monospace; }
</style>
</head>
<body>
  <div class="row">
    <button id="go">Unleash 😈</button>
  </div>
  <p id="msg">Drop an <b>audio.mp3</b> you own next to this file for sound.</p>
  <div id="ver">v1.4</div>
<script>
  const COUNT = 10;       // how many popups
  const popups = [];

  document.getElementById('go').addEventListener('click', () => {
    for (let i = 0; i < COUNT; i++) {
      const w = window.open('popup.html', 'bouncer' + i + '_' + Date.now(),
        'popup,width=180,height=120,left=' + (60 + i * 120) + ',top=' + (60 + i * 60));
      if (w) popups.push(w);
    }
    if (!popups.length) {
      document.getElementById('msg').textContent =
        'Popups were blocked — allow popups for this site and click again.';
    }
  });

  // Still clean up the popups if this page is closed.
  window.addEventListener('beforeunload', () => {
    while (popups.length) { const w = popups.pop(); try { w.close(); } catch(e){} }
  });
</script>
</body>
</html>
