<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Catch me!</title>
<style>
  body { margin: 0; height: 100vh; display: grid; place-items: center; font: bold 2rem system-ui, sans-serif; background: #ffd400; }
  button { position: fixed; bottom: 8px; right: 8px; }
</style>
</head>
<body>
  <div>Catch me! 🏃</div>
  <button onclick="window.close()">Close</button>
<script>
  // Bounce this window around the screen
  let x = window.screenX, y = window.screenY;
  let dx = 8 + Math.random() * 6, dy = 8 + Math.random() * 6;
  setInterval(() => {
    const maxX = screen.availWidth - window.outerWidth;
    const maxY = screen.availHeight - window.outerHeight;
    x += dx; y += dy;
    if (x <= 0 || x >= maxX) { dx = -dx; x = Math.max(0, Math.min(x, maxX)); }
    if (y <= 0 || y >= maxY) { dy = -dy; y = Math.max(0, Math.min(y, maxY)); }
    window.moveTo(x, y);
  }, 16);
</script>
</body>
</html>
