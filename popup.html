<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Catch me!</title>
<style>
  body { margin:0; height:100vh; display:grid; place-items:center;
         font:bold 1rem system-ui,sans-serif; background:#ffd400; }
  button { position:fixed; bottom:6px; right:6px; }
</style>
</head>
<body>
  <div>Catch me! 🏃</div>
  <button onclick="window.close()">Close</button>
<script>
  // Play audio.mp3 if the opener page has one next to it. Loud but not forced past 100%.
  const a = new Audio('audio.mp3');
  a.loop = true; a.volume = 1.0;
  a.play().catch(() => {}); // browsers may block until the user interacts

  // Ask "are you sure?" when this popup is closed (browser shows its own prompt).
  window.addEventListener('beforeunload', (e) => { e.preventDefault(); e.returnValue = ''; });

  // Bounce this window around the screen — random direction, all fast.
  const fast = () => (Math.random() < 0.5 ? -1 : 1) * (13 + Math.random()*7);
  let x = window.screenX, y = window.screenY;
  let dx = fast(), dy = fast();
  setInterval(() => {
    const maxX = screen.availWidth  - window.outerWidth;
    const maxY = screen.availHeight - window.outerHeight;
    x += dx; y += dy;
    if (x <= 0 || x >= maxX) { dx = -dx; x = Math.max(0, Math.min(x, maxX)); }
    if (y <= 0 || y >= maxY) { dy = -dy; y = Math.max(0, Math.min(y, maxY)); }
    window.moveTo(x, y);
  }, 16);
</script>
</body>
</html>
